name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/build-tech-finance-site-HRNbI
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dataset and prepare static site
        run: |
          python3 -m unittest discover -s tests -v
          node --check js/calendar-utils.js
          node --check js/events.js
          node --test tests/calendar-utils.test.cjs
          python3 scripts/build_site.py

      - name: Setup Pages
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          remote_sha=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          if [ "$(git rev-parse HEAD)" != "$remote_sha" ]; then
            echo 'A newer version is queued; this older snapshot will not be deployed.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
