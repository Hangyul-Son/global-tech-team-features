name: Weekly Global Tech refresh

on:
  schedule:
    # Saturday 18:00 UTC = Sunday 02:00 Hong Kong, with no daylight-saving shift.
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-global-tech
  cancel-in-progress: false

jobs:
  research:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record reviewed repository version
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check research model configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/weekly_refresh.py --preflight
      - name: Research with GPT-6 Astra and independently review with maximum reasoning
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/weekly_refresh.py
      - name: Refresh public source retrieval report
        run: python3 scripts/refresh_events.py
      - name: Validate approved event data and application
        run: |
          python3 -m unittest discover -s tests -v
          node --check js/calendar-utils.js
          node --check js/events.js
          node --test tests/calendar-utils.test.cjs
          python3 scripts/build_site.py
      - name: Prepare approved data
        run: |
          mkdir -p .weekly-refresh/publish
          cp data/events.json data/source-checks.json .weekly-refresh/report.json .weekly-refresh/publish/
      - name: Upload approved data
        uses: actions/upload-artifact@v4
        with:
          name: weekly-approved-data
          path: .weekly-refresh/publish/
          include-hidden-files: true
          retention-days: 30
      - name: Preserve research and exception report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-research-report
          path: .weekly-refresh/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Show concise run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('.weekly-refresh/report.json')
          if path.exists():
              r = json.loads(path.read_text())
              lines = ['Global Tech weekly research: ' + r['result'],
                       'Model: ' + r['model'] + '; reasoning: ' + r['reasoning'],
                       f"New events: {len(r.get('added', []))}; changed: {len(r.get('updated', []))}"]
              lines.extend(r.get('warnings', [])[:80])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('\n\n'.join(lines) + '\n')
          PY

  publish:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Preserve intervening manual changes
        env:
          REVIEWED_SHA: ${{ needs.research.outputs.base_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$REVIEWED_SHA" ]; then
            echo 'Repository changed during research. Nothing will be overwritten; run again on the new version.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: weekly-approved-data
          path: .weekly-refresh/approved
      - name: Apply only validated public event data
        run: |
          cp .weekly-refresh/approved/events.json data/events.json
          cp .weekly-refresh/approved/source-checks.json data/source-checks.json
          python3 -m unittest discover -s tests -v
          node --check js/calendar-utils.js
          node --check js/events.js
          node --test tests/calendar-utils.test.cjs
          python3 scripts/build_site.py
      - name: Commit approved data without changing scripts or coverage
        run: |
          git config user.name 'Global Tech weekly refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/source-checks.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh source-reviewed Global Tech calendar'
            git push origin HEAD
          fi
      - name: Check for newer changes before publishing
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          remote_sha=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          if [ "$(git rev-parse HEAD)" != "$remote_sha" ]; then
            echo 'A newer change exists; this older snapshot will not be deployed.'
            exit 1
          fi
      - name: Keep Pages publishing through Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          build_type=$(gh api "repos/$REPOSITORY/pages" --jq .build_type)
          if [ "$build_type" != 'workflow' ]; then
            if gh api --method PUT "repos/$REPOSITORY/pages" -f build_type=workflow >/dev/null; then
              echo 'Pages now publishes through Actions.'
            else
              echo '::warning::Set Settings > Pages > Source to GitHub Actions to prevent an unrelated branch from replacing this site.'
            fi
          fi
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish Global Tech
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the actual public event dataset before reporting success
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify_deployment.py --site-url "$PAGE_URL"

  email:
    needs: [research, publish]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download run report if research reached reporting
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: weekly-research-report
          path: .weekly-refresh/research
      - name: Email the actual publication result
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GLOBAL_TECH_EMAIL_FROM: ${{ vars.GLOBAL_TECH_EMAIL_FROM || secrets.GLOBAL_TECH_EMAIL_FROM }}
          PUBLICATION_RESULT: ${{ needs.publish.result }}
          RESEARCH_RESULT: ${{ needs.research.result }}
          SITE_URL: ${{ needs.publish.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result=$(python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('.weekly-refresh/research/report.json')
          if path.exists():
              report = json.loads(path.read_text())
          else:
              report = {'startedAt': datetime.now(timezone.utc).isoformat(),
                        'model': 'gpt-6-astra', 'reasoning': 'max', 'added': [], 'updated': [],
                        'warnings': ['Research report unavailable; check the workflow run.']}
          published = os.environ['PUBLICATION_RESULT'] == 'success'
          if published:
              result = 'published' if report.get('added') or report.get('updated') else 'unchanged'
          else:
              result = 'blocked' if report.get('result') == 'blocked' else 'failed'
          if not published:
              report.setdefault('warnings', []).append('Research job: ' + os.environ['RESEARCH_RESULT'] + '; publication job: ' + os.environ['PUBLICATION_RESULT'] + '. Publication was not verified.')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report))
          print(result)
          PY
          )
          python3 scripts/send_weekly_email.py --result "$result" --report .weekly-refresh/research/report.json --run-url "$RUN_URL" --site-url "$SITE_URL"
